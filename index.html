<!doctype html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<script>
(() => {
  const preventGesture = event => event.preventDefault();
  document.addEventListener('gesturestart', preventGesture, {passive:false});
  document.addEventListener('gesturechange', preventGesture, {passive:false});
  document.addEventListener('gestureend', preventGesture, {passive:false});
  document.addEventListener('wheel', event => {
    if (event.ctrlKey) event.preventDefault();
  }, {passive:false});
})();
</script>
<script>
(() => {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.getRegistrations()
    .then(regs => Promise.all(regs.map(reg => reg.unregister())))
    .then(() => 'caches' in window ? caches.keys() : [])
    .then(keys => Promise.all(keys.map(key => caches.delete(key))))
    .catch(() => {});
})();
</script>
<script>
(() => {
  try {
    const savedLanguage = localStorage.getItem('uc-lang') || '';
    if (savedLanguage === 'en' || savedLanguage === 'el') {
      document.documentElement.lang = savedLanguage;
      document.addEventListener('DOMContentLoaded', () => {
        const button = document.getElementById('langButton');
        if (button) button.textContent = savedLanguage === 'en' ? 'EN' : 'ΕΛ';
      });
    }
  } catch {}
})();
</script>
<script>
(() => {
  let saved = '';
  try { saved = localStorage.getItem('uc-theme') || ''; } catch {}
  document.documentElement.classList.toggle('force-dark', saved === 'dark');
  document.documentElement.classList.toggle('force-light', saved === 'light');
})();
</script>
<meta name="description" content="Ultimate Calculator">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="styles.css?v=0.4.127-s8">
<title>Ultimate Calculator</title>
</head>
<body>
<main class="app-shell">
<header class="topbar"><h1>Ultimate Calculator</h1><div class="top-actions"><button id="langButton" class="language-button" type="button">ΕΛ</button><button id="themeButton" class="icon-button" type="button" aria-label="Toggle theme">☾</button></div></header>
<section id="calculatorCard" class="calculator-card">
<div class="calculator-toolbar"><button id="historyButton" class="toolbar-button history-top" type="button"><span class="toolbar-icon">◷</span><span id="historyButtonText">Ιστορικό</span></button><div class="mode-control"><button id="modeButton" class="toolbar-button mode-top" type="button" aria-haspopup="menu" aria-expanded="false"><span id="modeIcon" class="toolbar-icon">▦</span><span id="modeLabel">Αριθμομηχανή</span><span class="mode-chevron" aria-hidden="true">⌄</span></button><div id="modeMenu" class="mode-menu hidden" role="menu"></div></div></div>
<div id="calculatorDisplay" class="display-wrap"><div class="expression-row"><div id="expression" class="expression" aria-live="polite"></div><button id="chartButton" class="how-button chart-button hidden" type="button" aria-label="Διάγραμμα"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button><button id="howButton" class="how-button hidden" type="button" aria-label="How was this calculated?">?</button></div><div id="result" class="result" aria-live="polite">0</div></div>
<div id="toolPanel" class="tool-panel hidden"></div>
<div id="keypad" class="keypad"><button class="key utility" data-action="backspace" type="button" aria-label="Delete">⌫</button><button id="clearButton" class="key utility" data-action="clear" type="button">AC</button><button class="key utility" data-value="%" type="button">%</button><button class="key operator" data-value="/" type="button">÷</button><button class="key" data-value="7" type="button">7</button><button class="key" data-value="8" type="button">8</button><button class="key" data-value="9" type="button">9</button><button class="key operator" data-value="*" type="button">×</button><button class="key" data-value="4" type="button">4</button><button class="key" data-value="5" type="button">5</button><button class="key" data-value="6" type="button">6</button><button class="key operator" data-value="-" type="button">−</button><button class="key" data-value="1" type="button">1</button><button class="key" data-value="2" type="button">2</button><button class="key" data-value="3" type="button">3</button><button class="key operator" data-value="+" type="button">+</button><button class="key utility" data-action="paren" type="button" aria-label="Παρενθέσεις">( )</button><button class="key" data-value="0" type="button">0</button><button class="key" data-value="," type="button">,</button><button class="key equals" data-action="equals" type="button">=</button></div>
<div class="bottom-actions"><button id="copyButton" class="secondary-button" type="button">Αντιγραφή αποτελέσματος</button></div>
</section>
<footer class="app-footer">Ultimate Calculator <span id="footerVersion">v0.4.127-s8</span><br><span id="createdBy">Δημιουργήθηκε από Leonidas Kampaxis</span></footer>
</main>
<aside id="sideKeys" class="side-tips side-left" aria-label="Συντομεύσεις πληκτρολογίου"></aside>
<aside id="sideTips" class="side-tips side-right" aria-label="Συμβουλές"></aside>
<div id="historyBackdrop" class="sheet-backdrop hidden"></div>
<section id="historyPanel" class="history-panel hidden" aria-label="History"><div class="sheet-handle" aria-hidden="true"></div><div class="section-heading"><h2 id="historyTitle">Ιστορικό</h2><div id="historyClearWrap" class="history-clear-wrap"><button id="historyChartButton" class="modal-close history-chart-toggle" type="button" aria-label="Διάγραμμα" title="Διάγραμμα" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="clearHistory" class="text-button" type="button">Διαγραφή όλων</button><div id="historyConfirm" class="history-confirm hidden" role="group"><span id="historyConfirmText"></span><button id="historyConfirmYes" class="danger-inline" type="button">Διαγραφή</button></div><button id="closeHistory" class="modal-close history-close" type="button" aria-label="Κλείσιμο">×</button></div></div><div id="historyChartWrap" class="history-chart hidden"><canvas id="historyChart"></canvas><div id="historyChartReadout" class="history-chart-readout"></div></div><div id="historyList" class="history-list"></div></section>
<div id="howModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="howTitle"><div class="modal-card how-modal-card"><div class="section-heading"><h2 id="howTitle">Πώς υπολογίστηκε</h2><button id="closeHow" class="modal-close" type="button" aria-label="Close">×</button></div><div id="howContent" class="how-content"></div></div></div>
<script src="charts.js?v=0.4.127-s8"></script>
<script src="app.js?v=0.4.127-s8"></script>
<script src="history-interaction.js?v=0.4.127-s8"></script>
<script>
(() => {
  document.addEventListener('keydown',e=>{if(/^F(?:[1-9]|1[0-2])$/.test(e.key))e.stopImmediatePropagation();},true);


})();
</script>
</body>
</html>
