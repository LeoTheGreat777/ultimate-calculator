<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="description" content="A universal everyday calculator that shows you the answer and, when you want, how it was calculated." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=0.2.1" />
  <title>Ultimate Calculator</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow">EVERYDAY CALCULATOR</div><h1>Ultimate Calculator <span class="version">v0.2.1</span></h1></div>
      <div class="top-actions"><button id="accountButton" class="account-button">Sign in</button><button id="themeButton" class="icon-button" aria-label="Toggle theme">☾</button></div>
    </header>
    <section class="calculator-card">
      <div class="display-wrap"><div id="expression" class="expression"></div><div id="result" class="result">0</div><button id="howButton" class="how-button hidden" type="button">How?</button></div>
      <div class="quick-tabs" role="tablist" aria-label="Calculator modes"><button class="tab active" data-mode="calc">Calc</button><button class="tab" data-mode="fuel">Fuel</button><button class="tab" data-mode="energy">Energy</button><button class="tab" data-mode="vat">VAT</button><button class="tab" data-mode="units">Units</button></div>
      <div id="toolPanel" class="tool-panel hidden"></div>
      <div id="keypad" class="keypad">
        <button class="key utility" data-action="clear">AC</button><button class="key utility" data-action="backspace">⌫</button><button class="key utility" data-value="%">%</button><button class="key operator" data-value="/">÷</button>
        <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key operator" data-value="*">×</button>
        <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key operator" data-value="-">−</button>
        <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key operator" data-value="+">+</button>
        <button class="key wide" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key equals" data-action="equals">=</button>
      </div>
      <div class="bottom-actions"><button id="historyButton" class="secondary-button">History</button><button id="copyButton" class="secondary-button">Copy result</button></div>
    </section>
    <section id="howPanel" class="how-panel hidden" aria-live="polite"><div class="section-heading"><h2>How we calculated it</h2><button id="closeHow" class="text-button">Close</button></div><div id="howContent" class="how-content"></div></section>
    <section id="historyPanel" class="history-panel hidden"><div class="section-heading"><h2>History</h2><button id="clearHistory" class="text-button">Clear all</button></div><div id="historyList" class="history-list"></div></section>
    <p class="hint">Try <strong>20 + 25%</strong>, <strong>80 - 15%</strong>, or open one of the everyday tools.</p>
    <footer class="app-footer">Ultimate Calculator <span>v0.2.1</span></footer>
  </main>
  <div id="authModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="authTitle"><div class="modal-card"><div class="section-heading"><h2 id="authTitle">Sign in</h2><button id="closeAuth" class="text-button">Close</button></div><div class="auth-tabs"><button id="loginTab" class="tab active">Sign in</button><button id="registerTab" class="tab">Create account</button></div><form id="authForm"><label class="auth-label">Username<input id="authUsername" autocomplete="username" required minlength="3"></label><label class="auth-label">Password<input id="authPassword" type="password" autocomplete="current-password" required minlength="8"></label><button class="tool-action" type="submit" id="authSubmit">Sign in</button></form><p id="authMessage" class="auth-message"></p></div></div>
  <script src="app.js?v=0.2.1"></script>
</body>
</html>
