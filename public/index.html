<script>
// Runs before the page is drawn. The app itself is in js/ (loaded at the end of the body).
// No pinch-zoom or Ctrl+wheel zoom: the app sizes itself (fitLayout).
(() => {
  const preventGesture = event => event.preventDefault();
  document.addEventListener('gesturestart', preventGesture, {passive:false});
  document.addEventListener('gesturechange', preventGesture, {passive:false});
  document.addEventListener('gestureend', preventGesture, {passive:false});
  document.addEventListener('wheel', event => {
    if (event.ctrlKey) event.preventDefault();
  }, {passive:false});
})();
(() => {
  // New users start in English and dark theme. People who used the app before that default keep
  // what they had: Greek, and a theme that follows the system.
  // Runs once per browser (uc-defaults marks it as done).
  try {
    if (!localStorage.getItem('uc-defaults')) {
      const usedBefore = Object.keys(localStorage).some(key => key.startsWith('uc-'));
      if (usedBefore && !localStorage.getItem('uc-lang')) localStorage.setItem('uc-lang', 'el');
      if (usedBefore && !localStorage.getItem('uc-theme')) localStorage.setItem('uc-theme', 'auto');
      localStorage.setItem('uc-defaults', '1');
    }
  } catch {}
})();
// iPhone/iPad home-screen app (navigator.standalone is Apple's): iOS draws a soft blur under the status bar over the
// page, so html.ios-app starts the page lower (styles.css).
if (navigator.standalone) document.documentElement.classList.add('ios-app');
(() => {
  try {
    const savedLanguage = localStorage.getItem('uc-lang') || '';
    if (savedLanguage === 'en' || savedLanguage === 'el') {
      document.documentElement.lang = savedLanguage;
      document.addEventListener('DOMContentLoaded', () => {
        const button = document.getElementById('langButton');
        if (button) button.textContent = savedLanguage === 'en' ? 'EN' : 'ΕΛ';
      });
    }
  } catch {}
})();
// Theme before the first paint, so the page never flashes the wrong colours (applyTheme in theme.js does the same later).
// Saved: auto (Match device: uc-theme-pair has a light and a dark one) or a theme name (THEMES in theme.js); anything
// else is dark. Own themes (uc-custom-themes) bring their colours as tokens, put here into html[data-theme] rules.
(() => {
  const get = key => { try { return localStorage.getItem(key); } catch { return null; } };
  const json = key => { try { return JSON.parse(get(key) || 'null') || {}; } catch { return {}; } };
  const groups = { light: ['light', 'paper', 'custom-light'], dark: ['dark', 'black', 'custom-dark'] };
  // themes removed in 0.14.2: their group until theme.js makes them the own theme (once)
  const removed = { rose: 'light', sky: 'light', ocean: 'dark', violet: 'dark', ember: 'dark', forest: 'dark' };
  const custom = json('uc-custom-themes'), made = {};
  let css = '';
  for (const g of ['light', 'dark']) {
    const vars = custom[g] && custom[g].vars;
    if (!vars || typeof vars !== 'object') continue;
    const rules = Object.keys(vars).filter(k => /^(--[a-z0-9-]+|color-scheme)$/.test(k) && /^[#\w(),. %-]+$/.test(vars[k])).map(k => k + ':' + vars[k]);
    css += 'html[data-theme="custom-' + g + '"],[data-theme-preview="custom-' + g + '"]{' + rules.join(';') + '}';
    made['custom-' + g] = true;
  }
  if (css) { const style = document.createElement('style'); style.id = 'customThemes'; style.textContent = css; document.head.appendChild(style); }
  const groupOf = name => groups.light.includes(name) ? 'light' : groups.dark.includes(name) ? 'dark' : removed[name] || '';
  const usable = name => (groups.light.includes(name) || groups.dark.includes(name)) && (!name.startsWith('custom-') || made[name]);
  let name = get('uc-theme') || '';
  if (name === 'auto') {
    const g = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    name = json('uc-theme-pair')[g];
    if (groupOf(name) !== g) name = g;
  }
  document.documentElement.dataset.theme = usable(name) ? name : groupOf(name) || 'dark';
})();
</script>
