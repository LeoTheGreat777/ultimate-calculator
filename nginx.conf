# Web server for the Docker image. The web root is the repo's public/ folder (see Dockerfile),
# so everything in the web root is meant to be public.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;

    # The page itself is never cached, so a new version shows up on the next load.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Scripts and styles: browsers check for a newer copy every time (they also carry ?v=VERSION).
    location ~ \.(?:js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # For Docker's health check.
    location = /api/health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true}';
    }

    location / {
        try_files $uri =404;
    }
}
